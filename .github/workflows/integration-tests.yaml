name: Integration Tests

on: workflow_dispatch # Allows manual trigger
#   push:
#     branches:
#       - main # Runs on push to the main branch

jobs:
  integration_tests:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📝 Write API_HOST to `tests/.env`
        run: |
          echo "API_HOST=${{ github.event.inputs.API_HOST }}" > tests/.env
          echo "✅ API_HOST saved: ${{ github.event.inputs.API_HOST }}"
          cat tests/.env

      - name: 🏗️ Set Up Python Environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: 📦 Install Dependencies
        run: |
          cd tests
          python -m venv .venv
          source .venv/bin/activate
          pip install -r requirements.txt

      - name: ✅ Run `pytest`
        run: |
          cd tests
          source .venv/bin/activate
          pytest --disable-warnings -v
